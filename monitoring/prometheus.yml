# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "prometheus"

  - job_name: "Node_Exporter"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "jenkins"
    metrics_path: /prometheus/
    static_configs:
      - targets: ["localhost:8080"]

  # pod/deployment state of the docker-desktop cluster (kube-state-metrics, Helm, NodePort 30080)
  - job_name: "kube-state-metrics"
    static_configs:
      - targets: ["localhost:30080"]
        labels:
          cluster: "docker-desktop" # dashboard 13332 filters every panel on the cluster label

  # CPU / memory / network of every pod, read from the kubelet (cAdvisor) through the API server
  # read-only service account monitoring/prometheus-scraper (nodes/proxy only)
  - job_name: "cadvisor"
    scheme: https
    metrics_path: /api/v1/nodes/docker-desktop/proxy/metrics/cadvisor
    authorization:
      credentials_file: /etc/prometheus/k8s-token
    tls_config:
      ca_file: /etc/prometheus/k8s-ca.crt
    static_configs:
      - targets: ["kubernetes.docker.internal:6443"]
        labels:
          cluster: "docker-desktop"
