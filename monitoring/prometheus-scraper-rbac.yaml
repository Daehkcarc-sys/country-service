# Read-only account Prometheus uses to scrape the kubelet's cAdvisor (pod CPU/memory) through the API server.
# kubectl apply -f prometheus-scraper-rbac.yaml
# then copy the token and CA into /etc/prometheus/k8s-token and /etc/prometheus/k8s-ca.crt (see prometheus.yml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scraper
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scraper-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: prometheus-scraper
type: kubernetes.io/service-account-token
