apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: country-service
  template:
    metadata:
      labels:
        app: country-service
    spec:
      containers:
        - name: country-service-container
          image: daehkcarcx/country-service:latest
          env:
            # the image defaults to the mysql profile (localhost:3306), which does not exist
            # inside the pod -> use the H2 in-memory database instead
            - name: SPRING_PROFILES_ACTIVE
              value: default
          ports:
            - containerPort: 8082
