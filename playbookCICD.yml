---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost # Or your build/deployment server
  connection: local

  # Docker Hub credentials, encrypted with Ansible Vault (ansible-vault view vault.yml)
  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: v1 # overridden by Jenkins with the build number (-e image_tag=...)
    dockerfile_path: "{{ playbook_dir }}"
    image: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
    k8s_namespace: jenkins
    node_port: 30008
    # docker-desktop only: never fall through to another context of the kubeconfig
    k8s_context: docker-desktop
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: yes # Re-authenticate even if credentials exist
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        force_source: yes
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local
      when: not ansible_check_mode # in --check the image is not really built

    - name: Pull Docker image (optional, for verification or on target nodes)
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull
      when: not ansible_check_mode

    - name: Create the Kubernetes namespace
      kubernetes.core.k8s:
        state: present
        kind: Namespace
        name: "{{ k8s_namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ k8s_context }}"

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        template: templates/deployment.yaml.j2
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ k8s_context }}"
        wait: yes # wait until the new pods are ready
        wait_timeout: 300

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ k8s_namespace }}"
        template: templates/service.yaml.j2
        kubeconfig: "{{ kubeconfig }}"
        context: "{{ k8s_context }}"

  post_tasks:
    - name: Log out of Docker Hub
      community.docker.docker_login:
        state: absent
