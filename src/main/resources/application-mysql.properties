# MySQL profile - activate it with:  spring.profiles.active=mysql
# (in Eclipse: Run Configurations > Arguments > Program arguments: --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/countries?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
